name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Convention guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Parses every module and enforces the hard rules from ENGINE_CONTRACT.md:
      # no Math.random, no runtime fetches, no remote URLs, no external asset
      # references, no stubs, and no dependencies outside the allowlist.
      - run: node tools/guard.mjs
      # Proves the guard still catches what it claims. The guard had a rule
      # scope that matched nothing on Windows, so it reported OK on a file
      # containing four separate violations -- and nothing tested it, so the
      # gap was invisible. This runs the guard against throwaway fixture
      # repos and asserts on the violations each one produces.
      - run: node tools/guard.test.mjs

  smoke:
    name: Boot + determinism
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Runners have no GPU, so this renders through SwiftShader. Deliberately
      # small: software rasterising this scene is slow, and resolution dominates
      # that cost while barely affecting the simulation being checked.
      #
      # `combat` rather than a quieter scenario because it puts 9 actors under live
      # AI, which is what the determinism assertion needs something to bite on.
      # Note the check compares the two runs against EACH OTHER, not against a
      # golden hash -- software and hardware rendering legitimately differ, and
      # asserting cross-machine equality would produce a permanently red build.
      - name: Smoke test (software rendering)
        run: node tools/smoke.mjs --software --scenario=combat --frames=45 --w=480 --h=270

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Convention guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Parses every module and enforces the hard rules from ENGINE_CONTRACT.md:
      # no Math.random, no runtime fetches, no remote URLs, no external asset
      # references, no stubs, and no dependencies outside the allowlist.
      - run: npm run guard
      # Proves the guard still catches what it claims. The guard had a rule
      # scope that matched nothing on Windows, so it reported OK on a file
      # containing four separate violations -- and nothing tested it, so the
      # gap was invisible. This runs the guard against throwaway fixture
      # repos and asserts on the violations each one produces.
      #
      # The `src/` rule cases feed the rules a literal backslash path — what
      # `relative()` returns on Windows — so a revert of the path
      # normalisation fails HERE. That is the job it has to do: a
      # path.sep-based normalisation is correct on Windows and broken on POSIX,
      # so the windows-latest job below cannot catch that revert, and this one
      # is the only job that can.
      - run: npm run guard:test

  # The same gate on Windows, because the bug it guards against was a Windows
  # one. The guard's rule scope was POSIX-only, so on Windows it silently
  # skipped every rule -- and CI only ran on Linux, where the old pattern
  # already worked, so nothing ever caught it. The unit tests now cover the
  # path normalisation directly on both platforms, but running the real guard
  # on a real Windows runner is still the check that would have caught the
  # original defect.
  #
  # Note what this job does NOT prove: the old `path.sep`-based normalisation
  # was correct on Windows, so reverting it passes here. The rule cases hand
  # the rules a backslash path on every platform, so the POSIX job is what
  # catches that revert.
  guard-windows:
    name: Convention guard (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run guard
      - run: npm run guard:test

  smoke:
    name: Boot + determinism
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Runners have no GPU, so this renders through SwiftShader. Deliberately
      # small: software rasterising this scene is slow, and resolution dominates
      # that cost while barely affecting the simulation being checked.
      #
      # `combat` rather than a quieter scenario because it puts 9 actors under live
      # AI, which is what the determinism assertion needs something to bite on.
      # Note the check compares the two runs against EACH OTHER, not against a
      # golden hash -- software and hardware rendering legitimately differ, and
      # asserting cross-machine equality would produce a permanently red build.
      - name: Smoke test (software rendering)
        run: node tools/smoke.mjs --software --scenario=combat --frames=45 --w=480 --h=270
